span x="272.22" y="288.43">card</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="272.22" y="308.43">[400]</tspan></text></g></g></g></svg>