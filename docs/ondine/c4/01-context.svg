<svg xmlns="http://www.w3.org/2000/svg" class="ondine ondine-c4" viewBox="0 0 1180 530" width="1180" height="530" style="max-width:100%;height:auto;--_bg:var(--ondine-bg,#fff);--_fg:var(--ondine-fg,#000);--_m:var(--ondine-muted,var(--_fg));--_l:var(--ondine-line,var(--_fg));--_s:var(--ondine-surface,var(--_bg));--_a:var(--ondine-surface-alt,color-mix(in srgb,var(--_fg) 20%,var(--_bg)));--_b:var(--ondine-border,var(--_fg));--_c:var(--ondine-accent,var(--_fg));--_sw:var(--ondine-stroke,2px);stroke-width:var(--_sw);color:var(--_fg);--_r:var(--ondine-radius,0);--_tw:var(--ondine-title-weight,bold);--_hw:var(--ondine-heading-weight,bold);--_fm:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font:16px monospace;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision" fill="var(--_fg)" role="graphics-document document" aria-roledescription="c4"><style>:root{color-scheme:light;--ondine-bg:#fff;--ondine-fg:#000;--ondine-line:#000}</style><text class="ondine-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="590" y="25.6">System Context diagram for Ondine</tspan></text><g transform="translate(8,94)"><g class="ondine-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="ondine-edge" data-id="author-ondine"><path d="M216,105L309,105"/><path class="ondine-marker" d="M316,105L308,108.36L308,101.64Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="ondine-npm"><path d="M424,210L424,291"/><path class="ondine-marker" d="M424,298L420.64,290L427.36,290Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="ondine-cloudflare"><path d="M316,193.18L193.03,293.57"/><path class="ondine-marker" d="M187.61,298L191.68,290.34L195.93,295.54Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="ondine-markdown"><path d="M478,0V-12Q478,-20 486,-20H994Q1002,-20 1002,-12V-7"/><path class="ondine-marker" d="M1002,0L998.64,-8L1005.36,-8Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="ondine-mermaid"><path d="M532,105L625,105"/><path class="ondine-marker" d="M632,105L624,108.36L624,101.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="ondine-nodes"><g class="ondine-node ondine-shape-person ondine-c4-person" data-id="author" transform="translate(108,105)"><rect x="-108" y="-79" width="216" height="184" rx="12" fill="var(--_s)" stroke="var(--_b)"/><circle cy="-91" r="13" fill="var(--_s)" stroke="var(--_b)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-36.8" text-anchor="middle">«person»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.4">Diagram Author</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="10.55">Developer who writes</tspan><tspan x="0" y="30.55">Mermaid source: .mmd</tspan><tspan x="0" y="50.55">files, Markdown fences,</tspan><tspan x="0" y="70.55">or diagram URLs.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-system" data-id="ondine" transform="translate(424,105)"><rect x="-108" y="-105" width="216" height="210" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-79.8" text-anchor="middle">«system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">Ondine</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-32.45">Compiles Mermaid source</tspan><tspan x="0" y="-12.45">to SVG ahead of time, so</tspan><tspan x="0" y="7.55">pages ship the SVG and a</tspan><tspan x="0" y="27.55">210-byte runtime.</tspan><tspan x="0" y="47.55">Written in Rust, and</tspan><tspan x="0" y="67.55">targets the syntax of</tspan><tspan x="0" y="87.55">Mermaid 12.1.0.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="mermaid" transform="translate(740,105)"><rect x="-108" y="-105" width="216" height="210" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Mermaid</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Defines the diagram</tspan><tspan x="0" y="7.55">syntax and the diagram</tspan><tspan x="0" y="27.55">model. Ondine follows</tspan><tspan x="0" y="47.55">that syntax, but does</tspan><tspan x="0" y="67.55">not run Mermaid.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="markdown" transform="translate(1056,105)"><rect x="-108" y="-105" width="216" height="210" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Markdown Host</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">GitHub and similar hosts</tspan><tspan x="0" y="7.55">that render README</tspan><tspan x="0" y="27.55">images, but run no</tspan><tspan x="0" y="47.55">scripts and load no page</tspan><tspan x="0" y="67.55">styles.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="cloudflare" transform="translate(108,363)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Cloudflare</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Runs the image Worker</tspan><tspan x="0" y="27.55">that serves diagram</tspan><tspan x="0" y="47.55">images.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="npm" transform="translate(424,363)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">npm Registry</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Publishes the ondine</tspan><tspan x="0" y="27.55">packages and their</tspan><tspan x="0" y="47.55">WebAssembly modules.</tspan></text></g></g><g class="ondine-edge-labels" font-size="13"><g class="ondine-edge-label" data-id="author-ondine"><rect x="213" y="45" width="86" height="120" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="256" y="59.55">Writes</tspan><tspan x="256" y="79.55">Mermaid</tspan><tspan x="256" y="99.55">source for</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="256" y="119.55">[npm, .mmd</tspan><tspan x="256" y="139.55">files,</tspan><tspan x="256" y="159.55">Markdown]</tspan></text></g><g class="ondine-edge-label" data-id="ondine-npm"><rect x="349.8" y="224" width="148.4" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="424" y="238.55">Publishes packages</tspan><tspan x="424" y="258.55">to</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="424" y="278.55">[npm]</tspan></text></g><g class="ondine-edge-label" data-id="ondine-cloudflare"><rect x="217.74" y="185.11" width="93.8" height="100" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="264.64" y="199.66">Runs the</tspan><tspan x="264.64" y="219.66">image</tspan><tspan x="264.64" y="239.66">Worker on</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="264.64" y="259.66">[Cloudflare</tspan><tspan x="264.64" y="279.66">Workers]</tspan></text></g><g class="ondine-edge-label" data-id="ondine-markdown"><rect x="524.2" y="-50" width="117.2" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="582.8" y="-35.45">Serves diagram</tspan><tspan x="582.8" y="-15.45">images to</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="582.8" y="4.55">[HTTPS]</tspan></text></g><g class="ondine-edge-label" data-id="ondine-mermaid"><rect x="529" y="75" width="86" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="572" y="89.55">Implements</tspan><tspan x="572" y="109.55">the syntax</tspan><tspan x="572" y="129.55">of</tspan></text></g></g></g></svg>