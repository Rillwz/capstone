fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-79.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">ondine package</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.45">[TypeScript, Rust,</tspan><tspan x="0" y="-16.45">WebAssembly]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">The compiler core, the</tspan><tspan x="0" y="27.55">CLI, the Vite and Remark</tspan><tspan x="0" y="47.55">plugins, the compiler</tspan><tspan x="0" y="67.55">APIs, and the mount</tspan><tspan x="0" y="87.55">runtime.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="cli" transform="translate(456,165)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">CLI</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[Node.js, TypeScript]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Renders diagrams and</tspan><tspan x="0" y="27.55">rewrites Markdown fences</tspan><tspan x="0" y="47.55">into links to the image</tspan><tspan x="0" y="67.55">Worker.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="vite" transform="translate(772,165)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Vite Plugin</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[TypeScript, Vite]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Compiles .mmd and</tspan><tspan x="0" y="37.55">.mermaid imports while</tspan><tspan x="0" y="57.55">the site builds.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="remark" transform="translate(1088,165)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Remark Plugin</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[TypeScript, unified]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Compiles Mermaid fences</tspan><tspan x="0" y="37.55">while the documentation</tspan><tspan x="0" y="57.55">builds.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="nodeapi" transform="translate(456,413)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Node Compiler API</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.45">[TypeScript,</tspan><tspan x="0" y="13.55">WebAssembly]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="37.55">Renders Mermaid source</tspan><tspan x="0" y="57.55">inside build scripts.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="page" transform="translate(832,729)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Page</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[HTML, CSS]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Holds the compiled SVG</tspan><tspan x="0" y="27.55">and the 210-byte mount</tspan><tspan x="0" y="47.55">runtime. No parser, no</tspan><tspan x="0" y="67.55">layout engine.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="readme" transform="translate(136,1193)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">README page</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[HTML, Markdown]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Shows the diagram image</tspan><tspan x="0" y="37.55">that the Worker</tspan><tspan x="0" y="57.55">rendered.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="workerapp" transform="translate(164,829)"><rect x="-108" y="-105" width="216" height="210" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-79.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-57.4">Image Worker</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-36.45">[TypeScript,</tspan><tspan x="0" y="-16.45">WebAssembly]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Serves SVG and PNG</tspan><tspan x="0" y="27.55">diagrams; the compiler</tspan><tspan x="0" y="47.55">module is precompiled,</tspan><tspan x="0" y="67.55">so a request downloads</tspan><tspan x="0" y="87.55">nothing.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="docsapp" transform="translate(484,819)"><rect x="-108" y="-95" width="216" height="190" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-69.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-47.4">Documentation Site</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-26.45">[TypeScript, TanStack</tspan><tspan x="0" y="-6.45">Start]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Serves the</tspan><tspan x="0" y="37.55">documentation, the</tspan><tspan x="0" y="57.55">playground, and the</tspan><tspan x="0" y="77.55">llms.txt files.</tspan></text></g></g><g class="ondine-edge-labels" font-size="13"><g class="ondine-edge-label" data-id="pkg-build"><rect x="275.3" y="115" width="78.2" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="314.4" y="129.55">Installed</tspan><tspan x="314.4" y="149.55">into</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="314.4" y="169.55">[npm]</tspan></text></g><g class="ondine-edge-label" data-id="build-workerapp"><rect x="267.74" y="561.79" width="93.8" height="80" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="314.64" y="576.34">Deploys the</tspan><tspan x="314.64" y="596.34">image</tspan><tspan x="314.64" y="616.34">Worker to</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="314.64" y="636.34">[wrangler]</tspan></text></g><g class="ondine-edge-label" data-id="build-docsapp"><rect x="469.8" y="558.4" width="148.4" height="80" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="544" y="572.95">Deploys the</tspan><tspan x="544" y="592.95">documentation site</tspan><tspan x="544" y="612.95">to</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="544" y="632.95">[wrangler]</tspan></text></g><g class="ondine-edge-label" data-id="workerapp-browser"><rect x="432.4" y="924" width="117.2" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="491" y="938.55">Serves diagram</tspan><tspan x="491" y="958.55">images to</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="491" y="978.55">[HTTPS]</tspan></text></g><g class="ondine-edge-label" data-id="docsapp-browser"><rect x="589.3" y="7