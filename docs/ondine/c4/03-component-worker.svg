ine-marker" d="M1084,616L1080.64,608L1087.36,608Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="errors-policy"><path d="M876,711L969,711"/><path class="ondine-marker" d="M976,711L968,714.36L968,707.64Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="preview-card"><path d="M344,711L251,711"/><path class="ondine-marker" d="M244,711L252,707.64L252,714.36Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="policy-host"><path d="M976,639.52L212.04,133.86"/><path class="ondine-marker" d="M206.2,130L214.73,131.61L211.02,137.22Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="policy-browser"><path d="M986.94,616L495.41,134.9"/><path class="ondine-marker" d="M490.41,130L498.48,133.19L493.78,138Z" fill="var(--_l)" stroke="none"/></g></g><g class="ondine-nodes"><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="host" transform="translate(108,65)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Markdown Host</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">GitHub and similar hosts</tspan><tspan x="0" y="27.55">that render README</tspan><tspan x="0" y="47.55">images.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="browser" transform="translate(424,65)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-29.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-7.4">Browser</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Shows a diagram, or a</tspan><tspan x="0" y="37.55">link preview of one.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="router" transform="translate(136,393)"><rect x="-108" y="-135" width="216" height="270" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-69.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-47.4">Request Router</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-26.45" text-anchor="middle">[TypeScript]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-2.45">Matches payload and</tspan><tspan x="0" y="17.55">source paths, answers</tspan><tspan x="0" y="37.55">HEAD, refuses other</tspan><tspan x="0" y="57.55">methods with 405, and</tspan><tspan x="0" y="77.55">unknown paths with 404.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="decoder" transform="translate(452,393)"><rect x="-108" y="-135" width="216" height="270" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-109.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-87.4">Payload Decoder</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-66.45">[TypeScript, zlib,</tspan><tspan x="0" y="-46.45">base64url]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.45">Inflates the</tspan><tspan x="0" y="-2.45">zlib-deflated, base64url</tspan><tspan x="0" y="17.55">payload, or reads the</tspan><tspan x="0" y="37.55">source query parameter.</tspan><tspan x="0" y="57.55">Enforces the</tspan><tspan x="0" y="77.55">4,096-character path</tspan><tspan x="0" y="97.55">limit and the 64 KiB</tspan><tspan x="0" y="117.55">source limit.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="renderer" transform="translate(768,393)"><rect x="-108" y="-135" width="216" height="270" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-89.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-67.4">Compiler Binding</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.45">[TypeScript,</tspan><tspan x="0" y="-26.45">WebAssembly]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-2.45">Renders the source with</tspan><tspan x="0" y="17.55">the size-optimized</tspan><tspan x="0" y="37.55">module for every diagram</tspan><tspan x="0" y="57.55">type, precompiled into</tspan><tspan x="0" y="77.55">the Worker so a request</tspan><tspan x="0" y="97.55">downloads nothing.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="scheme" transform="translate(1084,393)"><rect x="-108" y="-135" width="216" height="270" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Scheme Resolver</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[TypeScript, CSS]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Writes the light, dark,</tspan><tspan x="0" y="27.55">or auto scheme into the</tspan><tspan x="0" y="47.55">SVG as --ondine-* custom</tspan><tspan x="0" y="67.55">properties.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="card" transform="translate(136,711)"><rect x="-108" y="-95" width="216" height="190" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">PNG Card Renderer</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[TypeScript, resvg]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Draws the diagram on a</tspan><tspan x="0" y="27.55">1200x630 PNG card for</tspan><tspan x="0" y="47.55">hosts that do not</tspan><tspan x="0" y="67.55">display SVG.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="preview" transform="translate(452,711)"><rect x="-108" y="-95" width="216" height="190" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Preview Negotiator</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[TypeScript]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Answers link previewers</tspan><tspan x="0" y="27.55">with an HTML page whose</tspan><tspan x="0" y="47.55">og:image is the PNG</tspan><tspan x="0" y="67.55">card.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="errors" transform="translate(768,711)"><rect x="-108" y="-95" width="216" height="190" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Error Card Builder</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[TypeScript]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Builds the error card</tspan><tspan x="0" y="27.55">returned with status 400</tspan><tspan x="0" y="47.55">for an invalid, missing,</tspan><tspan x="0" y="67.55">or oversized payload.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-component" data-id="policy" transform="translate(1084,711)"><rect x="-108" y="-95" width="216" height="190" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-69.8" text-anchor="middle">«component»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-47.4">Response Policy</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-26.45" text-anchor="middle">[HTTP]</text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-2.45">Sets cache-control,</tspan><tspan x="0" y="17.55">content-security-policy,</tspan><tspan x="0" y="37.55">content-type,</tspan><tspan x="0" y="57.55">x-content-type-options,</tspan><tspan x="0" y="77.55">and vary.</tspan></text></g></g><g class="ondine-edge-labels" font-size="13"><g class="ondine-edge-label" data-id="host-router"><rect x="40" y="174" width="164" height="40" rx="3" fill="var(--_bg)"/><text x="122" y="188.55" text-anchor="middle">Requests images from</text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="122" y="208.55">[HTTPS]</tspan></text></g><g class="ondine-edge-label" data-id="browser-router"><rect x="223.46" y="180" width="164" height="40" rx="3" fill="var(--_bg)"/><text x="305.46" y="194.55" text-anchor="middle">Requests images from</text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="305.46" y="214.55">[HTTPS]</tspan></text></g><g class="ondine-edge-label" data-id="router-decoder"><rect x="241" y="373" width="86" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="284" y="387.55">Hands the</tspan><tspan x="284" y="407.55">payload to</tspan></text></g><g class="ondine-edge-label" data-id="router-preview"><rect x="246.1" y="538.84" width="109.4" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="300.8" y="553.39">Hands preview</tspan><tspan x="300.8" y="573.39">requests to</tspan></text></g><g class="ondine-edge-label" data-id="decoder-renderer"><rect x="557" y="373" width="86" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="600" y="387.55">Passes the</tspan><tspan x="600" y="407.55">source to</tspan></text></g><g class="ondine-edge-label" data-id="renderer-scheme"><rect x="886.9" y="373" width="78.2" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="926" y="387.55">Hands the</tspan><tspan x="926" y="407.55">SVG to</tspan></text></g><g class="ondine-edge-label" data-id="renderer-card"><rect x="385.6" y="562" width="132.8" height="20" rx="3" fill="var(--_bg)"/><text x="452" y="576.55" text-anchor="middle">Hands the SVG to</text></g><g class="ondine-edge-label" data-id="decoder-errors"><rect x="538.7" y="548.84" width="156.2" height="20" rx="3" fill="var(--_bg)"/><text x="616.8" y="563.39" text-anchor="middle">Reports failures to</text></g><g class="ondine-edge-label" data-id="renderer-errors"><rect x="689.9" y="570.8" width="156.2" height="20" rx="3" fill="var(--_bg)"/><text x="768" y="585.35" text-anchor="middle">Reports failures to</text></g><g class="ondine-edge-label" data-id="card-policy"><rect x="547.5" y="816" width="125" height="20" rx="3" fill="var(--_bg)"/><text x="610" y="830.55" text-anchor="middle">Returns through</text></g><g class="ondine-edge-label" data-id="scheme-policy"><rect x="1021.5" y="562" width="125" height="20" rx="3" fill="var(--_bg)"/><text x="1084" y="576.55" text-anchor="middle">Returns through</text></g><g class="ondine-edge-label" data-id="errors-policy"><rect x="894.7" y="691" width="62.6" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="926" y="705.55">Returns</tspan><tspan x="926" y="725.55">through</tspan></text></g><g class="ondine-edge-label" data-id="preview-card"><rect x="254.9" y="691" width="78.2" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="294" y="705.55">Names the</tspan><tspan x="294" y="725.55">card of</tspan></text></g><g class="ondine-edge-label" data-id="policy-host"><rect x="759.54" y="507.61" width="125" height="60" rx="3" fill="var(--_bg)"/><text x="822.04" y="522.16" text-anchor="middle">Answers</text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="822.04" y="542.16">[image/svg+xml,</tspan><tspan x="822.04" y="562.16">image/png]</tspan></text></g><g class="ondine-edge-label" data-id="policy-browser"><rect x="527.22" y="197.2" width="125" height="60" rx="3" fill="var(--_bg)"/><text x="589.72" y="211.75" text-anchor="middle">Answers</text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="589.72" y="231.75">[image/svg+xml,</tspan><tspan x="589.72" y="251.75">image/png]</tspan></text></g></g></g></svg>