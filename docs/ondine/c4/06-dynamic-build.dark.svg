s="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="27.55">Ships the compiled SVG</tspan><tspan x="0" y="47.55">and the mount runtime.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-container" data-id="mount" transform="translate(108,319)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Mount Runtime</tspan></text><text class="ondine-c4-techn" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.45">[TypeScript, 210 bytes</tspan><tspan x="0" y="13.55">gzip]</tspan></text><text class="ondine-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="37.55">Inserts the precompiled</tspan><tspan x="0" y="57.55">SVG into the element.</tspan></text></g><g class="ondine-node ondine-shape-rect ondine-c4-external_system ondine-c4-external" data-id="browser" transform="translate(424,319)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="ondine-c4-type" font-size="12" fill="var(--_m)" x="0" y="-19.8" text-anchor="middle">«external system»</text><text class="ondine-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="2.6">Browser</tspan></text><text class="ondine-c4-descr" font-size="13" x="0" y="27.55" text-anchor="middle">Shows the page.</text></g></g><g class="ondine-edge-labels" font-size="13"><g class="ondine-edge-label" data-id="author-vite"><rect x="213" y="38" width="86" height="80" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="256" y="52.55">1: Imports</tspan><tspan x="256" y="72.55">a diagram</tspan><tspan x="256" y="92.55">file into</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="256" y="112.55">[build]</tspan></text></g><g class="ondine-edge-label" data-id="vite-compiler"><rect x="527.3" y="87" width="109.4" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="582" y="101.55">2: Asks to</tspan><tspan x="582" y="121.55">render</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="582" y="141.55">[WebAssembly]</tspan></text></g><g class="ondine-edge-label" data-id="compiler-vite"><rect x="549" y="-11" width="86" height="80" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="592" y="3.55">3: Returns</tspan><tspan x="592" y="23.55">the SVG</tspan></text><text class="ondine-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="592" y="43.55">[inline</tspan><tspan x="592" y="63.55">SVG]</tspan></text></g><g class="ondine-edge-label" data-id="vite-page"><rect x="673.6" y="-40" width="132.8" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="740" y="-25.45">4: Emits the SVG</tspan><tspan x="740" y="-5.45">into</tspan></text></g><g class="ondine-edge-label" data-id="author-browser"><rect x="221.07" y="180" width="93.8" height="40" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="267.97" y="194.55">5: Opens</tspan><tspan x="267.97" y="214.55">the page in</tspan></text></g><g class="ondine-edge-label" data-id="browser-page"><rect x="704.8" y="188.5" width="70.4" height="20" rx="3" fill="var(--_bg)"/><text x="740" y="203.05" text-anchor="middle">6: Loads</text></g><g class="ondine-edge-label" data-id="browser-mount"><rect x="230.8" y="309" width="70.4" height="20" rx="3" fill="var(--_bg)"/><text x="266" y